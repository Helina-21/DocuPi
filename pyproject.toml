[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docetl"
version = "0.1.0"
description = "Document ETL toolkit"
authors = [{name = "DocuPi"}]
dependencies = [
    "typer",
    "pyyaml",
    "pydantic",
    "faiss-cpu",
    "numpy",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "rich",
    "jinja2",
    "openai>=1.0.0",
    "python-dateutil",
]

[project.scripts]
docetl = "docetl.cli:main"
