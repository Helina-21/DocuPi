name: contracts_risk
steps:
  - name: ingest
    type: local_folder
    config:
      path: eval/datasets/sample_contracts/docs
  - name: chunk
    type: chunk
    config:
      size: 500
      overlap: 50
  - name: embed
    type: embed
    config:
  - name: retrieve
    type: retrieve
    config:
      top_k: 2
  - name: sink
    type: jsonl_sink
    config:
      path: runs/output.jsonl
